name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    # The real-Chrome and account-backed suites are intentionally opt-in.
    # The explicitly selected portable suite stays independent of Chrome
    # installation and login state.
    env:
      ASK_LIVE_CAPABILITY_TEST: "0"
      ASK_LIVE_TEST: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run portable unit tests
        run: npm run test:unit

      - name: Check whitespace
        run: git diff --check

      - name: Verify generated files
        run: git diff --exit-code -- dist
